appId: com.baloilauncher.app
productName: Opus Launcher
directories:
  buildResources: build
extraResources:
  - ludusavi
  - hydra-native
  - seeds
  - from: node_modules/create-desktop-shortcuts/src/windows.vbs
  - from: resources/achievement.wav
files:
  - "!.cache/**"
  - "!.claude/**"
  - "!server/**"
  - "!native/torrent-bridge/**"
  - "!**/.vscode/*"
  - "!src/*"
  - "!native/hydra-native/target"
  - "!native/hydra-native/target/**"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!**/.env"
  - "!**/.env.*"
  - "!{.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.test.json}"
  - "!scripts/register-ts-node.mjs"
asarUnpack:
  - resources/**
  - node_modules/sharp/**
  - node_modules/@img/sharp-libvips-*/**
win:
  executableName: OpusLauncher
  extraResources:
    - from: binaries/7z.exe
    - from: binaries/7z.dll
    # Epic Games integration — Legendary 0.21.1 (GPL-3.0), unmodified, with its LICENSE.
    - from: binaries/legendary
      to: legendary
  target:
    - nsis
    - portable
nsis:
  artifactName: Opus-Launcher-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: installer.nsh
portable:
  artifactName: Opus-Launcher-${version}-portable.${ext}
  unpackDirName: false
# Electron fuses, flipped in the shipped executable: it can't be reused as a plain Node runtime
# (ELECTRON_RUN_AS_NODE / NODE_OPTIONS / --inspect), cookies are encrypted at rest, and the app
# code must come from the integrity-checked app.asar.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
npmRebuild: false
# Fails the build when the native addon, Ludusavi or Legendary are missing or not the pinned ones.
beforePack: scripts/check-bundled-binaries.cjs
# Auto-update feed on our own server (signed-in users only); the GitHub repo is private and its
# release feed is unreachable for installed apps. Release files go to /opt/hydra-server/updates.
publish:
  provider: generic
  url: https://gordotrofeus.duckdns.org/updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
